spring.application.name=campus-erp
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_erp?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Expense receipts are at most 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# A missing true/false field in a request means false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Business rules
app.financial-year-start-month=4
# "Today" (dashboard, calendar, financial year) is worked out in this time zone, not the server's
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# Login tokens. JWT_SECRET (32+ characters) has no default: the app won't start without it.
# The dev profile (application-dev.properties) sets one for local use.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480

# Passwords for the accounts created on an empty database. Only needed for that first start.
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.staff-password=${STAFF_PASSWORD:}
app.seed.viewer-password=${VIEWER_PASSWORD:}

# Load the fictional records in src/main/resources/sample-data into an empty database
app.seed.demo-data=${SEED_DEMO_DATA:false}
