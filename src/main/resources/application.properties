spring.application.name=campus-erp
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_erp?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# A missing true/false field in a request means false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Business rules
app.financial-year-start-month=4

# Login tokens. Set JWT_SECRET (32+ characters) anywhere outside your own machine.
app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
app.jwt.expiration-minutes=480

# Accounts created on an empty database. Dev values only, change them from the Users page.
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.staff-password=${STAFF_PASSWORD:staff123}
app.seed.viewer-password=${VIEWER_PASSWORD:viewer123}

# Load the fictional records in src/main/resources/sample-data into an empty database
app.seed.demo-data=${SEED_DEMO_DATA:true}

# Set to true only if you deliberately want the public defaults above on a non-local database
app.allow-dev-defaults=${ALLOW_DEV_DEFAULTS:false}
