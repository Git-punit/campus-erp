# Dev profile, for your own machine only:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Uses a built-in database kept in ./data/ (delete the folder to start again
# from the sample data). Set DB_URL / DB_USERNAME / DB_PASSWORD to use your
# local MySQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campus_erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Public development values. Never use these on a server.
app.jwt.secret=dev-only-secret-do-not-use-in-production-0123456789
app.seed.admin-password=admin123
app.seed.staff-password=staff123
app.seed.viewer-password=viewer123
app.seed.demo-data=true
