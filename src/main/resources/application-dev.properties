# Dev profile: run without MySQL.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Data is kept in ./data/ in the project folder, so it survives restarts.
# Delete that folder to start again from the sample data.
spring.datasource.url=jdbc:h2:file:./data/campus_erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
